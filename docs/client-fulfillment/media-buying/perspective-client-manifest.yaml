  - perspective-funnel-setup-sop.md
  - ../reverse-mortgage-dna/rm-funnel-form-spec.md
  - ../../operations/perspective-intelligence-bridge.md
  - perspective-client-manifest.yaml

mcp:
  server: perspective
  endpoint: https://perspective-api.co/mcp
  cursor_config: ~/.cursor/mcp.json
  auth: oauth_via_mcp_remote

supabase:
  project_id: fszmndldcvrrmitfbwde
  project_name: WM Reporting
  join_tables:
    - clients
    - events
  notes: Use events for CPL, qualified, appointments, shows after GHL ingest — not for funnel step structure.

citation_format: "perspective:funnel:{funnel_id}"

# Populate clients via Perspective MCP sync. One row per live published funnel.
# client_slug must match Supabase clients.slug and DNA folder naming where applicable.
