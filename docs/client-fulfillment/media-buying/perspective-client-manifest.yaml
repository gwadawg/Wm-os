    funnel_name: Reverse Template
    published_url: null
    ghl_sub_account: null
    domain: hecm.homequityhacks.com
    status: active
    step_count: 13
    os_refs:
      - ../reverse-mortgage-dna/rm-funnel-form-spec.md
