      - burnt-by-other-agencies
    related_docs:
      - ../sales/objection-handling-master-guide.md
      - ../../company/overview-money-model-april-26.md

  - id: do-we-guarantee-results
    sequence: 6
    title: "Do We Guarantee Results?"
    landing_copy:
      eyebrow: "Our guarantee"
      headline: "Do we guarantee results? Yes — and here's exactly what that means."
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/doweguaranteeresults
    watch_url: https://youtu.be/Km5e5lM5mrw
    youtube_id: Km5e5lM5mrw
    format: youtube_short
    purpose: Break competitor guarantee objections; explain pay-per-result pitfalls and what Waiz guarantees instead.
    objection_categories:
      - uncertainty-based
      - fear-based
      - logistical-logic-based
    pre_handle_beliefs:
      - Do you guarantee results?
      - Pay per close or pay per appointment sounds safer
      - Competitor guarantee seems too good to be true
      - More appointments from pay-per-book models means better outcomes
      - Waiz has no guarantee or weak guarantee
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - objection-response
      - pre-demo-offer-clarity
    use_cases:
      - prospect_link_when_guarantee_objection
      - setter_or_closer_send_when_comparing_pay_per_result_offers
      - landing_page_embed
      - social_short_repurpose
    pairs_with_asset_ids:
      - what-makes-waiz-different
      - leads-arent-everything
      - burnt-by-other-agencies
    compliance_note: >-
      Video states specific guarantee terms (e.g. 50 conversations / 90 days).
      Confirm live offer language against founder-approved pricing/offer docs before quoting in calls or copy.
    related_docs:
      - ../../company/overview-money-model-april-26.md
      - ../sales/objection-handling-master-guide.md
      - ../sales/disqualifying-financial-qualification.md

  - id: reverse-sales-team-call-center
    sequence: 7
    title: "How Does Our Reverse Sales Team Work?"
    landing_copy:
      eyebrow: "Inside our operation"
      headline: "How our reverse sales team books qualified appointments on your calendar"
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/callcenter
    watch_url: https://youtu.be/RgjA7v6K3lk
    youtube_id: RgjA7v6K3lk
    format: long_form
    purpose: Explain the reverse sales assistant / call center operation and why it differentiates Waiz from lead-only competitors.
    objection_categories:
      - uncertainty-based
      - logistical-logic-based
    pre_handle_beliefs:
      - Waiz only runs ads and dumps leads
      - I can nurture and dial my own database
      - Call centers sound generic and hurt my brand
      - AI bots are enough for follow-up
      - Speed to lead does not matter
      - Competitors pre-qualify the same way
