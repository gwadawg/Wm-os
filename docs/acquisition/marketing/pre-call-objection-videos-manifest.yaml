assets:
  - id: whoweare-why-we-do-what-we-do
    sequence: 1
    title: "Why We Do What We Do"
    landing_copy:
      eyebrow: "About Waiz Media"
      headline: "Why we built a company exclusively for reverse mortgage loan officers"
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/whoweare
    watch_url: https://youtu.be/RYnwas5j7iI
    youtube_id: RYnwas5j7iI
    purpose: Establish trust; show who Waiz is and why the company exists before the strategy call.
    objection_categories:
      - uncertainty-based
    pre_handle_beliefs:
      - Who is Waiz / can I trust this company?
      - Reverse is stigmatized; marketing makes it worse
      - Referrals and recycled leads are the only path
      - Generic agencies do not understand reverse
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - post-book-pre-demo
    use_cases:
      - prospect_link
      - landing_page_embed
      - ad_campaign_nurture
      - setter_or_closer_send_before_strategy_call
    related_docs:
      - ../../company/doctrine-identity-core-april-26.md
      - ../intelligence/wm-sales-intelligence-bible.md

  - id: rm-opportunity-industry
    sequence: 2
    title: "Opportunity in the Reverse Mortgage Industry"
    landing_copy:
      eyebrow: "The market opportunity"
      headline: "The reverse mortgage opportunity is larger — and more urgent — than most LOs realize"
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/rmopportunity
    watch_url: https://youtu.be/wlGAgHRX_QI
    youtube_id: wlGAgHRX_QI
    purpose: Prove Waiz knows the industry; educate on the scale of reverse opportunity and why acting now matters.
    objection_categories:
      - uncertainty-based
      - logistical-logic-based
    pre_handle_beliefs:
      - Reverse is a small or dying market
      - Timing is wrong / I can wait
      - Referrals and word of mouth are enough to grow
      - Better sales skills fix pipeline (vs. education/marketing)
      - Only 2% penetration means limited upside (reframe to 98% untapped)
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - post-book-pre-demo
      - ad_campaign_top-of-funnel
    use_cases:
      - prospect_link
      - landing_page_embed
      - ad_campaign_nurture
      - urgency_before_strategy_call
      - setter_or_closer_send_when_market_size_objection
    related_docs:
      - ../intelligence/wm-sales-intelligence-bible.md
      - ../../company/overview-money-model-april-26.md

  - id: what-makes-waiz-different
    sequence: 3
    title: "What Makes Waiz Media Different?"
    landing_copy:
      eyebrow: "How we're different"
      headline: "What makes Waiz Media different from every other marketing agency"
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/whatmakesusdifferent
    watch_url: https://youtu.be/uYr9nfeGHHs
    youtube_id: uYr9nfeGHHs
    purpose: Differentiate Waiz from generic marketing agencies and sell the three-part acquisition system before the strategy call.
    objection_categories:
      - uncertainty-based
      - fear-based
    pre_handle_beliefs:
      - Waiz is just another marketing agency
      - Generic forward-mortgage playbooks work for reverse
      - Agencies deliver lead lists or low-quality Facebook leads
      - Stock or scammy ads hurt trust in reverse
      - I only need ads, not dial team or CRM
      - Referrals are enough; I do not need a full system
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - post-book-pre-demo
      - pre-demo-differentiation
    use_cases:
      - prospect_link
      - landing_page_embed
      - ad_campaign_nurture
      - setter_or_closer_send_when_comparing_vendors
      - setter_or_closer_send_before_strategy_call
    related_docs:
      - ../../company/overview-money-model-april-26.md
      - ../intelligence/wm-sales-intelligence-bible.md
      - ../../company/doctrine-identity-core-april-26.md

  - id: burnt-by-other-agencies
    sequence: 4
    title: "Burnt By Different Companies?"
    landing_copy:
      eyebrow: "If you've been burned before"
      headline: "Why past agency experiences fail — and how we're built differently"
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/burnt
    watch_url: https://youtu.be/8sqNYp6T3Vg
    youtube_id: 8sqNYp6T3Vg
    format: youtube_short
    purpose: Pre-handle fear from bad agency experiences; explain why those failures happened and how reverse marketing was done wrong.
    objection_categories:
      - fear-based
      - uncertainty-based
    pre_handle_beliefs:
      - Burned by a marketing agency before
      - Tried ads; leads were garbage
      - Agency took money and disappeared
      - Locked in contract with zero results
      - LO-turned-agency vendors cannot run marketing ops
      - Generic multi-product agencies use templates not reverse expertise
      - Leads handed over vs appointments booked on calendar
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - objection-response
      - ad_campaign_retargeting
    use_cases:
      - prospect_link_when_burned_objection
      - setter_or_closer_send_after_agency_horror_story
      - landing_page_embed
      - social_short_repurpose
    pairs_with_asset_ids:
      - whoweare-why-we-do-what-we-do
      - what-makes-waiz-different
    related_docs:
      - ../sales/objection-handling-master-guide.md
      - ../sales/wm-objection-categories.md

  - id: leads-arent-everything
    sequence: 5
    title: "Leads Aren't Everything (Here's What Loan Officers Should Track Instead)"
    landing_copy:
      eyebrow: "Beyond lead lists"
      headline: "Leads aren't enough. Here's what actually moves your pipeline."
    prospect_page_url: https://wm.waizmedia.net/reversemortgage/leads
    watch_url: https://youtu.be/HZf-n-7DDm8
    youtube_id: HZf-n-7DDm8
    format: youtube_short
    purpose: Reframe the broken decade-long leads-only model; success requires more than lead volume; differentiate Waiz from lead-vendor agencies.
    objection_categories:
      - uncertainty-based
      - logistical-logic-based
    pre_handle_beliefs:
      - Waiz is like every other agency that only sells leads
      - More leads equals more success
      - Lead count is the right KPI
      - Past decade lead-gen playbook should still work
      - Marketing vendor job ends at the lead
    funnel_stages:
      - pre-call-nurture
      - landing-page
      - objection-response
      - ad_campaign_retargeting
    use_cases:
      - prospect_link_when_leads_only_objection
      - setter_or_closer_send_when_comparing_to_lead_vendors
      - landing_page_embed
      - social_short_repurpose
    pairs_with_asset_ids:
